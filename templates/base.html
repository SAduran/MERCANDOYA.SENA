{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MERCANDO YA - {% block titulo %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #124481; color: #f9fce7; }
        .navbar { background-color: #1eb6c1 !important; }
        .navbar-brand { color: #ffd80f !important; font-weight: 900; font-size: 1.5rem; letter-spacing: 1px; }
        .btn-success { background-color: #1eb6c1; border-color: #1eb6c1; color: #f9fce7; font-weight: bold; }
        .btn-success:hover { background-color: #189aa3; border-color: #189aa3; color: #f9fce7; }
        .table { color: #f9fce7; }
        .table thead { background-color: #1eb6c1; color: #f9fce7; }
        .table-striped > tbody > tr:nth-of-type(odd) { background-color: rgba(30,182,193,0.1); color: #f9fce7; }
        .table-striped > tbody > tr:nth-of-type(even) { background-color: rgba(249,252,231,0.03); color: #f9fce7; }
        .table-hover > tbody > tr:hover { background-color: rgba(255,216,15,0.12); color: #f9fce7; }
        .table { border-color: #1a5a9a; }
        .card { background-color: #0e3668; border-color: #1a5a9a; }
        .alert-info { background-color: #0e3668; border-color: #1eb6c1; color: #1eb6c1; }
        .alert-success { background-color: #0e3668; border-color: #1eb6c1; color: #1eb6c1; }
        .alert-error, .alert-danger { background-color: #0e3668; border-color: #dc3545; color: #dc3545; }
        .form-control { background-color: #0e3668; border-color: #1a5a9a; color: #f9fce7; }
        .form-control:focus { background-color: #133f75; border-color: #ffd80f; color: #f9fce7; box-shadow: 0 0 0 0.2rem rgba(255,216,15,0.25); }
        .form-control::placeholder { color: #7a9ec4; }
        .form-label { color: #ffd80f; }
        .btn-warning { background-color: #ffd80f; border-color: #ffd80f; color: #124481; font-weight: bold; }
        .btn-warning:hover { background-color: #e6c20e; border-color: #e6c20e; color: #124481; }
        .btn-danger { background-color: #dc3545; border-color: #dc3545; }
        .btn-secondary { background-color: #1a5a9a; border-color: #1a5a9a; color: #f9fce7; }
        .btn-secondary:hover { background-color: #1e6ab5; }
        h2 { color: #ffd80f; }
        h3 { color: #ffd80f; }
        .text-danger { color: #dc3545 !important; }
        a { color: #1eb6c1; }
        a:hover { color: #ffd80f; }
    </style>
</head>
<body>
    <nav class="navbar mb-4">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" href="{% url 'lista_productos' %}">
                <img src="{% static 'img/logo1.png' %}" alt="Logo" height="40" class="me-2">
                MERCANDO-YA
            </a>
        </div>
    </nav>

    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
